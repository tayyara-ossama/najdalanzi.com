# Bare-metal nginx site config (no Docker).
# 1) Build:   npm ci && npm run build
# 2) Copy:    index.html assets/css assets/js assets/img robots.txt sitemap.xml site.webmanifest favicon.png apple-touch-icon.png
#             -> /var/www/najdalanazi   (do NOT copy assets/images, node_modules, src)
# 3) Install: cp deploy/nginx-najdalanazi.conf /etc/nginx/sites-available/najdalanazi
#             cp docker/security-headers.conf /etc/nginx/snippets/security-headers.conf
#             ln -s /etc/nginx/sites-available/najdalanazi /etc/nginx/sites-enabled/
#             nginx -t && systemctl reload nginx
# 4) HTTPS:   certbot --nginx -d najdalanazi.com -d www.najdalanazi.com
#             (certbot rewrites this file to add the 443 block and the HTTP->HTTPS redirect)

server {
    listen 80;
    listen [::]:80;
    server_name najdalanazi.com www.najdalanazi.com;

    root /var/www/najdalanazi;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/najdalanazi.access.log;
    error_log  /var/log/nginx/najdalanazi.error.log;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Partner profile PDFs: open inline, revalidate daily
    location ~* \.pdf$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Disposition "inline";
        try_files $uri =404;
    }

    location = /site.webmanifest { types { } default_type application/manifest+json; }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Canonical host: the page declares https://www.najdalanazi.com/ as canonical.
