services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: najd-alanzi-landing:latest
    container_name: najd-alanzi-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
